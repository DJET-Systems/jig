# SPDX-License-Identifier: AGPL-3.0-only
# Release pipeline: a validated semver tag produces the reproducible source
# tarball, its SHA-256 checksum, and the GitHub Release that carries both.
# Contract: docs/reference/versioning.md
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: git archive and notes need the tag object

      - name: Validate the tag
        run: |
          set -euo pipefail
          # Full SemVer 2.0.0, optional rc pre-release. No other suffix is a release.
          if ! printf '%s\n' "$TAG" | grep -qxE 'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?'; then
            echo "Tag '$TAG' is not a release tag: expected vMAJOR.MINOR.PATCH[-rc.N]." >&2
            exit 1
          fi
          VER="${TAG#v}"
          BASE="${VER%%-*}"  # 0.1.0-rc.9 -> 0.1.0
          CMAKE_V=$(grep -E '^project\(jig VERSION' CMakeLists.txt | awk '{print $3}' | tr -d ')')
          if [ "$BASE" != "$CMAKE_V" ]; then
            echo "Tag base $BASE does not match project(jig VERSION $CMAKE_V) in CMakeLists.txt." >&2
            echo "Those two may not drift; fix one or the other and push again." >&2
            exit 1
          fi
          echo "VERSION=$VER" >> "$GITHUB_ENV"
          echo "Prerelease: $([ "$TAG" != "v$BASE" ] && echo yes || echo no)"

      - name: Stage the tagged tree
        run: |
          set -euo pipefail
          mkdir stage
          git archive --prefix="jig-${VERSION}/" "$TAG" | tar -x -C stage
          # Ship the docs book generated, so the tarball is complete out of the box.
          python3 "stage/jig-${VERSION}/tools/build_site_docs.py"

      - name: Reproducible tarball
        run: |
          set -euo pipefail
          EPOCH=$(git rev-list -1 --timestamp "$TAG" | cut -d' ' -f1)
          tar -czf "jig-${VERSION}.tar.gz" \
            --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime="@${EPOCH}" --mode='go=rX,u+rw,a-s' \
            -C stage "jig-${VERSION}"
          tar -tzf "jig-${VERSION}.tar.gz" | head -3

      - name: SHA-256 checksums
        run: |
          set -euo pipefail
          sha256sum "jig-${VERSION}.tar.gz" > SHA256SUMS

      - name: Release notes from the changelog
        run: |
          set -euo pipefail
          # Keep a Changelog: notes are the `## [<version>]` section.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]($| )"   { on=1; next }
            on && /^## /                    { exit }
            on                              { print }
          ' CHANGELOG.md > NOTES.md
          if [ ! -s NOTES.md ]; then
            echo "CHANGELOG.md has no section for $VERSION; the release will use generated notes." >&2
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PRERELEASE=""
          if [ "$TAG" != "v${VERSION%%-*}" ]; then PRERELEASE="--prerelease"; fi
          NOTES="--generate-notes"
          if [ -s NOTES.md ]; then NOTES="--notes-file NOTES.md"; fi
          gh release create "$TAG" \
            "jig-${VERSION}.tar.gz" \
            SHA256SUMS \
            --verify-tag \
            --title "jig $VERSION" \
            $NOTES \
            $PRERELEASE

      - name: Remove the staging tree
        if: always()
        run: rm -rf stage
